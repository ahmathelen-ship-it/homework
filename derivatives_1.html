<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Производная — первая часть ЕГЭ</title>
<style>
:root{--navy:#13265c;--navy2:#1e3a8a;--red:#e53935;--blue:#1e88e5;--green:#16a34a}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#c9d8ff,#eef3ff 40%,#e6f0ff);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#0f1d40;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:12px auto;border:7px solid var(--navy);border-radius:24px;background:#fff;overflow:hidden;box-shadow:0 10px 30px rgba(19,38,92,.25)}
@media(max-width:600px){.wrap{margin:6px;border-width:5px;border-radius:18px}}
header{background:linear-gradient(135deg,var(--navy),#2746a8);color:#fff;padding:14px 16px 10px}
h1{margin:0 0 10px;font-size:clamp(19px,5vw,26px)}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{flex:1 1 150px;border:2px solid #8fb0ff;background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:9px 10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
nav button.on{background:#ffd43b;color:var(--navy);border-color:#ffd43b}
.prog{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--navy);padding:10px 16px;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:16px;background:#dde6ff;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#ff6b6b,#ffd43b,#51cf66);transition:width .5s}
.ptxt{font-weight:700;white-space:nowrap;font-size:15px}
main{padding:8px 16px 16px}
@media(max-width:600px){main{padding:6px 8px 12px}}
.intro{background:#fff8db;border:2px solid #ffd43b;border-radius:16px;padding:12px 14px;margin:12px 0;font-size:17px;line-height:1.45}
h2{font-size:19px;color:var(--navy2);margin:22px 0 4px}
.card{position:relative;border:2px solid #c7d4f5;border-radius:16px;padding:14px 14px 12px 50px;margin:12px 0;background:#f7f9ff}
@media(max-width:600px){.card.wide{padding:50px 10px 12px 10px}}
.card.done{border-color:var(--green);background:#effcf3}
.num{position:absolute;left:10px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--navy2);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.card.done .num{background:var(--green);font-size:0}
.card.done .num::after{content:"✓";font-size:18px}
@media(max-width:600px){.card.wide .ctitle{margin-top:-42px;margin-left:40px;min-height:34px}}
.sent{font-size:18px;line-height:1.7}
.gap{display:inline-block;min-width:90px;padding:0 8px;border-bottom:3px dashed var(--navy2);text-align:center;font-weight:700;color:var(--navy2)}
.gap.ok{border-bottom-color:var(--green);color:var(--green);background:#dcfce7;border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip,.word{border:2px solid var(--navy2);border-radius:999px;padding:8px 14px;font-size:16px;color:var(--navy);cursor:pointer;font-family:inherit;font-weight:600}
.c0{background:#fff3c4}.c1{background:#d7f5ff}.c2{background:#ffe0ef}.c3{background:#e3ffd9}.c4{background:#efe3ff}.c5{background:#ffe7d1}
.chip.wrong{opacity:.45;text-decoration:line-through;cursor:default;border-color:#bbb}
.chip.right{background:#dcfce7;border-color:var(--green);color:#14532d;cursor:default}
.fb{margin-top:10px;padding:8px 12px;border-radius:10px;font-size:16px;line-height:1.4}
.fb.good{background:#dcfce7;color:#14532d;font-weight:700}
.fb.bad{background:#fff1f1;color:#7f1d1d;border:1px solid #fecaca}
.fb.info{background:#eef2ff;color:#1e3a8a}
details.hint{margin-top:8px;background:#fffbea;border:2px solid #ffd43b;border-radius:10px;padding:6px 12px;font-size:16px;line-height:1.4}
details.hint summary{cursor:pointer;font-weight:700;color:#8a5a00}
details.hint[open] summary{margin-bottom:4px}
.intro details.hint{background:#fff;margin-top:10px}
.tag{display:inline-block;font-size:15px;font-weight:600;color:#475569;margin-bottom:2px}
.howto{font-size:15px;color:#475569;margin:4px 0 8px}
.ctitle{font-size:18px;font-weight:700;line-height:1.35}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:8px;border:2px dashed #c7d4f5;border-radius:12px;background:#fff;margin:8px 0}
.word{background:#fff3c4;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.word.sel{outline:3px solid #f59e0b;outline-offset:2px;transform:scale(1.06)}
.word.dragging{opacity:.35}
.ghost{position:fixed;pointer-events:none;display:none;transform:translate(-50%,-60%);z-index:99;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.gwrap{position:relative;width:100%;max-width:540px;margin:6px auto;background:#fff;border-radius:12px;border:1px solid #dbe3f7}
.gsvg{display:block;width:100%;height:auto}
.zone{position:absolute;transform:translate(-50%,-50%);width:25%;height:13%;min-height:26px;border:2px dashed #3b5bdb;border-radius:10px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:clamp(10px,2.9vw,15px);font-weight:700;color:var(--navy);cursor:pointer;text-align:center;line-height:1.1}
.zone.inline{position:static;transform:none;display:inline-flex;width:140px;height:38px;vertical-align:middle;font-size:15px}
.zone.full{border-style:solid;background:#fff7d6}
.zone.badz{border-color:var(--red);background:#ffe3e3;animation:shake .4s}
.card.done .zone.full{border-color:var(--green);background:#dcfce7}
.card.done .zone{cursor:default}
.extline{font-size:17px;margin-top:10px;line-height:2.2}
@keyframes shake{25%{margin-left:-4px}75%{margin-left:4px}}
/* картинки с точками */
.pic{position:relative;width:100%;margin:8px auto;border:1px solid #dbe3f7;border-radius:10px;overflow:hidden;background:#fff}
.pic img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;pointer-events:none}
.pic.p3{max-width:560px}
.relabel{position:absolute;background:#fff;color:#000;font-family:"Times New Roman",serif;font-style:italic;display:flex;align-items:center;justify-content:center;font-size:clamp(11px,3.4vw,30px);white-space:nowrap}
.hs,.pk,.pt{position:absolute;transform:translate(-50%,-50%);width:6%;min-width:22px;aspect-ratio:1/1;border-radius:50%;padding:0;border:3px solid var(--navy);background:transparent;cursor:pointer;box-shadow:0 0 0 2px rgba(255,255,255,.8)}
.pk::after,.pt::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--navy)}
.hs.red{background:rgba(229,57,53,.3);border:4px solid var(--red)}
.hs.blue{background:rgba(30,136,229,.3);border:4px solid var(--blue)}
.hs.violet{background:rgba(124,58,237,.3);border:4px solid #7c3aed}
.p4 .hs{width:4%;min-width:16px;border-width:2.5px}
.p4 .hs.red,.p4 .hs.blue,.p4 .hs.violet{border-width:3px}
.p4 .relabel{font-size:clamp(11px,3.6vw,22px)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll .pic.p4{min-width:600px}
.swipe{display:none;font-size:14px;color:#64748b;margin-top:4px}
@media(max-width:640px){.swipe{display:block}}
.card.done .hs,.card.done .pk{cursor:default}
.pt{cursor:default;width:4.5%;min-width:18px;border-color:#e8590c}
.pk.wrongp{background:rgba(150,150,150,.45);border-color:#888;cursor:default}
.pk.rightp{background:rgba(81,207,102,.45);border-color:var(--green)}
.lb{position:absolute;left:85%;bottom:85%;background:var(--navy);color:#fff;font-weight:700;font-size:clamp(11px,3vw,15px);padding:1px 6px;border-radius:8px;pointer-events:none;font-family:inherit}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;margin:2px 0 6px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:4px;border:2px solid var(--navy)}
.chk{border:none;background:var(--navy2);color:#fff;font-weight:700;font-size:16px;padding:10px 20px;border-radius:12px;cursor:pointer;font-family:inherit}
footer{padding:4px 16px 18px;text-align:center}
#reset{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:12px;padding:10px 18px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.modal{position:fixed;inset:0;background:rgba(10,20,50,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border:5px solid var(--navy);border-radius:18px;padding:18px;max-width:340px;text-align:center;font-size:18px}
.mbox button{margin:12px 6px 0;padding:10px 16px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
#mYes{background:var(--red);color:#fff;border:none}
#mNo{background:#fff;color:var(--navy);border:2px solid var(--navy)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📈 Производная. Первая часть ЕГЭ</h1>
    <nav id="menu"></nav>
  </header>
  <div class="prog"><div class="bar"><div class="fill" id="fill"></div></div><div class="ptxt" id="ptxt"></div></div>
  <main id="main"></main>
  <footer><button id="reset">↺ Сбросить прогресс</button></footer>
</div>
<div id="ghost" class="word ghost"></div>
<div id="modal" class="modal"><div class="mbox">Сбросить все ответы и баллы?<br><button id="mYes">Да, сбросить</button><button id="mNo">Отмена</button></div></div>

const HF = 'это график функции: максимум — вершина горки, минимум — дно ямки. Точки на оси Ox здесь ни при чём. Не пропусти маленькие горки и ямки!';
const HD = 'это график производной: экстремумы функции там, где линия пересекает ось Ox. Был «+», стал «−» — максимум; был «−», стал «+» — минимум. Горки и ямки самой производной — не экстремумы.';
const B4 = [
 {id:'e1', part:'f', sec:'Часть А. Это график ФУНКЦИИ y = f(x)', text:'Отметь все точки <b>максимума</b> функции.', color:'red', ans:['h2','h4','h6','h8'], hint:HF},
 {id:'e2', part:'f', text:'Отметь все точки <b>минимума</b> функции.', color:'blue', ans:['h1','h3','h5','h7'], hint:HF},
 {id:'e3', part:'f', text:'Отметь все точки <b>экстремума</b> функции.', color:'violet', ans:['h1','h2','h3','h4','h5','h6','h7','h8'], hint:'экстремумы — это все максимумы и минимумы вместе. ' + HF},
 {id:'e4', part:'d', sec:'Часть Б. Та же картинка, но теперь это график ПРОИЗВОДНОЙ y = f′(x)', text:'Отметь все точки <b>максимума</b> функции.', color:'red', ans:['z1','z3','z5'], hint:HD},
 {id:'e5', part:'d', text:'Отметь все точки <b>минимума</b> функции.', color:'blue', ans:['z2','z4'], hint:HD},
 {id:'e6', part:'d', text:'Отметь все точки <b>экстремума</b> функции.', color:'violet', ans:['z1','z2','z3','z4','z5'], hint:'экстремумы — это все максимумы и минимумы вместе. ' + HD}
];
B4.forEach(t=>{ t.type='pts'; t.max=2; t.img='i4'; });
const IMGS = {
 i2:{src:IMG2, w:1020, h:423, pts:P2, relabel:[416,102,134,42], cls:''},
 i4:{src:IMG4, w:640, h:439, pts:P4, relabel:[44,44,142,42], cls:'p4'}
};

const ALL = [B1,B2,B3,B4];
const T = {};
ALL.forEach((list,bi)=>list.forEach((t,i)=>{ t.block=bi+1; t.n=i+1; T[t.id]=t; }));

/* ===================== СОСТОЯНИЕ ===================== */
let S, sel = null, drag = null;
const busy = {}, badZ = {};
function load(){ try{ S = JSON.parse(localStorage.getItem(KEY)); }catch(e){ S = null; } if(!S || !S.t) S = {block:1, t:{}}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function ts(id){ if(!S.t[id]) S.t[id] = {a:0, done:false, pts:0, wrong:[], place:{}, sel:[]}; return S.t[id]; }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function score(max, attempt){ return attempt===1 ? max : attempt===2 ? max/2 : 0; }
function fmt(n){ return String(Math.round(n*10)/10).replace('.', ','); }
function okMsg(p, max){
  if(p===max) return 'Верно! +' + fmt(p) + ' 🎉';
  if(p>0) return 'Верно! +' + fmt(p) + ' 👍';
  return 'Верно! Теперь ты это точно знаешь 💪';
}
function finish(id){ const st=ts(id), t=T[id]; st.done=true; st.pts=score(t.max, st.a+1); save(); rerender(id); updProg(); }
function fbHTML(id, extra){
  const st=ts(id), t=T[id];
  if(st.done) return `<div class="fb good">${okMsg(st.pts,t.max)}</div>`;
  if(st.info) return `<div class="fb info">${st.info}</div>`;
  if(st.a>0) return `<div class="fb bad">🤔 Пока не так. ${extra||''}</div><details class="hint"><summary>💡 Подсказка</summary>${t.hint.charAt(0).toUpperCase()+t.hint.slice(1)}</details>`;
  return '';
}
function cardOpen(t, wide){ const st=ts(t.id); return `<div class="card ${wide?'wide':''} ${st.done?'done':''}" id="card-${t.id}"><div class="num">${t.n}</div>`; }
const pct = (v,tot)=>(v/tot*100).toFixed(2)+'%';

/* ---------- пропуски ---------- */
function gapHTML(t){
  const st = ts(t.id);
  if(!st.order || st.order.length!==t.opts.length){ st.order = shuffle(t.opts.map((_,i)=>i)); save(); }
  const gap = st.done ? `<span class="gap ok">${t.opts[0]}</span>` : `<span class="gap">?</span>`;
  const chips = st.done ? '' : `<div class="chips">${st.order.map((i,k)=>
     `<button class="chip c${k%6} ${st.wrong.includes(i)?'wrong':''}" data-g="${t.id}" data-i="${i}">${t.opts[i]}</button>`).join('')}</div>`;
  return cardOpen(t) + `<div class="sent">${t.pre}${gap}${t.post}</div>${chips}${fbHTML(t.id)}</div>`;
}
function pickGap(id, i){
  const st = ts(id);
  if(st.done || st.wrong.includes(i)) return;
  if(i===0) return finish(id);
  st.a++; st.wrong.push(i); save(); rerender(id);
}

/* ---------- перетаскивание ---------- */
const WORDS = ['максимум','минимум','экстремумы'];
const CORRECT = {p1:'максимум', p2:'минимум', dis:null, ext:'экстремумы'};
function geo(kind){
  const X = t => 40 + (t+2.1)*80;
  if(kind==='f'){
    const Y = v => 40 + (3.6-v)/6.7*180;
    return {fn:t=>t*t*t-3*t, X, Y, label:'y = f(x)', yl:'y',
      pts:[{z:'p1',t:-1,dx:0,dy:-34},{z:'p2',t:1,dx:0,dy:34},{z:'dis',t:0,dx:-46,dy:32}]};
  }
  const Y = v => 40 + (3.8-v)/5.2*180;
  return {fn:t=>t*t-1, X, Y, label:'y = f′(x)', yl:'y′',
    pts:[{z:'p1',t:-1,dx:-44,dy:30},{z:'p2',t:1,dx:44,dy:30},{z:'dis',t:0,dx:0,dy:30}]};
}
function zoneHTML(id, z, extra, style){
  const st = ts(id), w = st.place[z];
  const bad = badZ[id] && badZ[id].includes(z);
  return `<div class="zone ${extra||''} ${w?'full':''} ${bad?'badz':''}" data-t="${id}" data-z="${z}" ${style||''}>${w||''}</div>`;
}
function dndHTML(t){
  const id = t.id, st = ts(id);
  if(!st.words){ st.words = shuffle(WORDS); save(); }
  const g = geo(t.kind), y0 = g.Y(0);
  let d = '';
  for(let i=0;i<=200;i++){ const x = -2.1 + i*4.25/200; d += (i?'L':'M') + g.X(x).toFixed(1) + ',' + g.Y(g.fn(x)).toFixed(1); }
  let svg = `<svg class="gsvg" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
   <defs><marker id="ar${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#0f1d40"/></marker></defs>
   <line x1="12" y1="${y0}" x2="394" y2="${y0}" stroke="#0f1d40" stroke-width="2" marker-end="url(#ar${id})"/>
   <line x1="28" y1="254" x2="28" y2="8" stroke="#0f1d40" stroke-width="2" marker-end="url(#ar${id})"/>
   <text x="382" y="${y0+20}" font-size="16" font-style="italic">x</text>
   <text x="36" y="20" font-size="16" font-style="italic">${g.yl}</text>
   <text x="220" y="26" font-size="17" font-weight="700" fill="#1e3a8a">${g.label}</text>
   <path d="${d}" fill="none" stroke="#c62828" stroke-width="3.5" stroke-linejoin="round"/>`;
  let zones = '';
  g.pts.forEach(p=>{
    const px = g.X(p.t), py = g.Y(g.fn(p.t)), zx = px+p.dx, zy = py+p.dy;
    svg += `<line x1="${px}" y1="${py}" x2="${zx}" y2="${zy}" stroke="#3b5bdb" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="${px}" cy="${py}" r="6" fill="#13265c" stroke="#fff" stroke-width="2"/>`;
    zones += zoneHTML(id, p.z, '', `style="left:${(zx/4).toFixed(2)}%;top:${(zy/2.6).toFixed(2)}%"`);
  });
  svg += '</svg>';
  const placed = Object.values(st.place).filter(Boolean);
  const bank = st.words.filter(w=>!placed.includes(w));
  return cardOpen(t) + `<div class="ctitle">${t.title}</div>
    ${st.done?'':'<div class="howto">Перетащи слово в рамку или нажми на слово, а потом на рамку. Одна рамка на графике останется пустой. <b>2 балла</b></div>'}
    ${st.done?'':`<div class="bank">${bank.map(w=>`<span class="word ${sel&&sel.t===id&&sel.w===w?'sel':''}" data-t="${id}" data-w="${w}">${w}</span>`).join('')}</div>`}
    <div class="gwrap">${svg}${zones}</div>
    <div class="extline">Максимум и минимум вместе называются: ${zoneHTML(id,'ext','inline')}</div>
    ${fbHTML(id)}</div>`;
}
function place(t, w, z){
  const st = ts(t);
  for(const k in st.place) if(st.place[k]===w) st.place[k] = null;
  st.place[z] = w; save();
  if(Object.values(st.place).filter(Boolean).length===3) checkDnd(t); else rerender(t);
}
function checkDnd(t){
  const st = ts(t), bad = [];
  ['p1','p2','dis','ext'].forEach(z=>{ if((st.place[z]||null)!==CORRECT[z]) bad.push(z); });
  if(!bad.length) return finish(t);
  st.a++; save(); badZ[t] = bad; busy[t] = true; rerender(t);
  setTimeout(()=>{ bad.forEach(z=>{ st.place[z] = null; }); badZ[t] = null; busy[t] = false; save(); rerender(t); }, 1500);
}

/* ---------- блок 2: отметить точки ---------- */
function ptsHTML(t){
  const st = ts(t.id), I = IMGS[t.img];
  const relabel = t.part==='d' ? `<div class="relabel" style="left:${pct(I.relabel[0],I.w)};top:${pct(I.relabel[1],I.h)};width:${pct(I.relabel[2],I.w)};height:${pct(I.relabel[3],I.h)}">y = f′(x)</div>` : '';
  const hs = Object.keys(I.pts).map(k=>{
    const [x,y] = I.pts[k], on = st.sel.includes(k);
    return `<button class="hs ${on?t.color:''}" data-t="${t.id}" data-p="${k}" style="left:${pct(x,I.w)};top:${pct(y,I.h)}"></button>`;
  }).join('');
  const col = {red:'#e53935', blue:'#1e88e5', violet:'#7c3aed'}[t.color];
  const pic = `<div class="pic ${I.cls}"><img src="${I.src}" alt="график">${relabel}${hs}</div>`;
  const tag = t.part==='f' ? '<span class="tag">График функции y = f(x)</span>' : '<span class="tag">График производной y = f′(x)</span>';
  return cardOpen(t,true) + `<div class="ctitle">${tag}<br>${t.text}</div>
    ${st.done?'':`<div class="howto">Нажимай на кружки на графике (повторное нажатие снимает отметку), потом «Проверить». <b>2 балла</b></div><div class="legend"><span><span class="dot" style="background:${col}"></span>отмеченная точка</span></div>`}
    ${pic}
    ${st.done?'':`<button class="chk" data-t="${t.id}">Проверить</button>`}
    ${fbHTML(t.id, st.msg||'')}</div>`;
}
function togglePt(id, k){
  const st = ts(id); if(st.done) return;
  const i = st.sel.indexOf(k); if(i>=0) st.sel.splice(i,1); else st.sel.push(k);
  st.info = ''; save(); rerender(id);
}
function checkPts(id){
  const st = ts(id), t = T[id]; if(st.done) return;
  if(!st.sel.length){ st.info = 'Сначала отметь точки на графике 🙂'; save(); rerender(id); return; }
  st.info = '';
  const extra = st.sel.some(k=>!t.ans.includes(k)), miss = t.ans.some(k=>!st.sel.includes(k));
  if(!extra && !miss) return finish(id);
  st.a++;
  st.msg = extra && miss ? 'Есть лишние точки, и отмечены не все. ' : extra ? 'Есть лишние точки. ' : 'Отмечены не все точки. ';
  save(); rerender(id);
}

/* ---------- блок 3 ---------- */
function dotsHTML(list, cls, tid, extraCls){
  return list.map(([lab,[x,y]])=>`<button class="${cls} ${extraCls?extraCls(lab):''}" ${tid?`data-t="${tid}" data-l="${lab}"`:'tabindex="-1"'} style="left:${pct(x,648)};top:${pct(y,417)}"><span class="lb">${lab}</span></button>`).join('');
}
function pairHTML(t){
  const st = ts(t.id);
  if(st.swap===undefined){ st.swap = Math.random()<.5; save(); }
  const lab = i => (st.swap ? 1-i : i) === 0 ? 'A' : 'B';
  const list = t.pts.map((p,i)=>[lab(i),p]);
  const right = 'в точке ' + lab(t.big);
  const opts = ['в точке A','в точке B','одинаковая'];
  const chips = `<div class="chips">${opts.map((o,k)=>`<button class="chip opt c${k} ${st.wrong.includes(o)?'wrong':''} ${st.done&&o===right?'right':''}" data-t="${t.id}" data-o="${o}" ${st.done?'disabled':''}>${o}</button>`).join('')}</div>`;
  return cardOpen(t,true) + `<div class="ctitle">В какой точке производная <b>больше</b>?</div>
    <div class="pic p3"><img src="${IMG3}" alt="график">${dotsHTML(list,'pt')}</div>${chips}${fbHTML(t.id)}</div>`;
}
function pickPair(id, o){
  const st = ts(id), t = T[id]; if(st.done || st.wrong.includes(o)) return;
  const right = 'в точке ' + (((st.swap ? 1-t.big : t.big)===0) ? 'A' : 'B');
  if(o===right) return finish(id);
  st.a++; st.wrong.push(o); save(); rerender(id);
}
function pickHTML(t){
  const st = ts(t.id);
  const cls = lab => st.wrong.includes(lab) ? 'wrongp' : (st.done && lab===t.ans ? 'rightp' : '');
  return cardOpen(t,true) + `<div class="ctitle">${t.text}</div>
    <div class="pic p3"><img src="${IMG3}" alt="график">${dotsHTML(Object.entries(PICK5),'pk',t.id,cls)}</div>${fbHTML(t.id)}</div>`;
}
function pickPoint(id, lab){
  const st = ts(id), t = T[id]; if(st.done || st.wrong.includes(lab)) return;
  if(lab===t.ans) return finish(id);
  st.a++; st.wrong.push(lab); save(); rerender(id);
}

/* ===================== ОТРИСОВКА ===================== */
function html(t){
  return {gap:gapHTML, dnd:dndHTML, pts:ptsHTML, pair:pairHTML, pick:pickHTML}[t.type](t);
}
function rerender(id){ const el = document.getElementById('card-'+id); if(el) el.outerHTML = html(T[id]); }
const INTRO = [
 `🚗 Спидометр показывает, как быстро едет машина — то есть как быстро меняется путь.
  У функции тоже есть свой «спидометр» — <b>производная</b>. Заполни пропуски: нажимай на нужные слова.`,
 `📍 Одна и та же картинка — сначала как график <b>функции</b>, потом как график <b>производной</b>.
  <details class="hint"><summary>💡 Вспомни</summary>У функции смотрим на стрелки ↗↘, у производной — на знаки + и −.</details>`,
 `⛰ Сравни производные в точках на графике функции.
  <details class="hint"><summary>💡 Вспомни</summary>Производная — это крутизна графика. Круто вверх ↗ — производная большая. Полого — близка к нулю.
  Вниз ↘ — производная отрицательная, и чем круче спуск, тем она меньше: −5 &lt; −1.</details>`,
 `🏔 Найди точки экстремума: сначала на графике функции, потом на графике производной.
  <details class="hint"><summary>💡 Вспомни</summary>На графике <b>функции</b> экстремумы — это горки и ямки. На графике <b>производной</b> — точки, где линия пересекает ось Ox и меняет знак.
  Отмечай все такие точки — на графике есть и маленькие!</details>`
];
function renderMenu(){
  document.getElementById('menu').innerHTML = BLOCKS.map((b,i)=>`<button data-b="${i+1}" class="${S.block===i+1?'on':''}">${b}</button>`).join('');
}
function renderMain(){
  const m = document.getElementById('main'), list = ALL[S.block-1];
  if(!list){ m.innerHTML = '<div class="intro" style="text-align:center">🛠 Этот блок скоро появится</div>'; return; }
  let h = `<div class="intro">${INTRO[S.block-1]}</div>`;
  list.forEach(t=>{ if(t.sec) h += `<h2>${t.sec}</h2>`; h += html(t); });
  m.innerHTML = h;
}
function updProg(){
  let p = 0, mx = 0;
  Object.values(T).forEach(t=>{ mx += t.max; p += ts(t.id).pts; });
  const pc = Math.round(p/mx*100);
  document.getElementById('fill').style.width = pc + '%';
  document.getElementById('ptxt').textContent = `⭐ ${fmt(p)} из ${mx} · ${pc}%`;
}
function renderAll(){ renderMenu(); renderMain(); updProg(); }

/* ===================== СОБЫТИЯ ===================== */
const modal = document.getElementById('modal');
document.addEventListener('click', e=>{
  const q = s => e.target.closest(s);
  let el;
  if(el=q('nav button')){ S.block = +el.dataset.b; sel = null; save(); renderMenu(); renderMain(); window.scrollTo(0,0); return; }
  if(el=q('.opt')){ pickPair(el.dataset.t, el.dataset.o); return; }
  if(el=q('.chip')){ pickGap(el.dataset.g, +el.dataset.i); return; }
  if(el=q('.hs')){ togglePt(el.dataset.t, el.dataset.p); return; }
  if(el=q('.chk')){ checkPts(el.dataset.t); return; }
  if(el=q('.pk')){ pickPoint(el.dataset.t, el.dataset.l); return; }
  if(el=q('.zone')){
    const t = el.dataset.t, st = ts(t);
    if(st.done || busy[t]) return;
    if(sel && sel.t===t){ const w = sel.w; sel = null; place(t, w, el.dataset.z); }
    else if(st.place[el.dataset.z]){ st.place[el.dataset.z] = null; save(); rerender(t); }
    return;
  }
  if(q('#reset')){ modal.classList.add('on'); return; }
  if(q('#mNo') || e.target===modal){ modal.classList.remove('on'); return; }
  if(q('#mYes')){
    modal.classList.remove('on');
    try{ localStorage.removeItem(KEY); }catch(err){}
    S = {block:1, t:{}}; sel = null; renderAll(); window.scrollTo(0,0);
  }
});
const ghost = document.getElementById('ghost');
document.addEventListener('pointerdown', e=>{
  const w = e.target.closest('.word');
  if(!w || w===ghost) return;
  const t = w.dataset.t;
  if(ts(t).done || busy[t]) return;
  drag = {t, w:w.dataset.w, x:e.clientX, y:e.clientY, moving:false, el:w};
  try{ w.setPointerCapture(e.pointerId); }catch(err){}
});
document.addEventListener('pointermove', e=>{
  if(!drag) return;
  if(!drag.moving && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) > 6){
    drag.moving = true; ghost.textContent = drag.w; ghost.style.display = 'block'; drag.el.classList.add('dragging');
  }
  if(drag.moving){ ghost.style.left = e.clientX+'px'; ghost.style.top = e.clientY+'px'; }
});
document.addEventListener('pointerup', e=>{
  if(!drag) return;
  const d = drag; drag = null;
  if(d.moving){
    ghost.style.display = 'none'; d.el.classList.remove('dragging');
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const z = el && el.closest('.zone');
    sel = null;
    if(z && z.dataset.t===d.t) place(d.t, d.w, z.dataset.z); else rerender(d.t);
  } else {
    sel = (sel && sel.t===d.t && sel.w===d.w) ? null : {t:d.t, w:d.w};
    rerender(d.t);
  }
});
document.addEventListener('pointercancel', ()=>{
  if(!drag) return; ghost.style.display = 'none'; drag.el.classList.remove('dragging'); drag = null;
});

load(); renderAll();
</script>
</body>
</html>
